<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbuddy 与 React 概览页对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #e8edf5; color: #162033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1 { margin: 0 0 16px; font-size: 22px; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      figure { margin: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; box-shadow: 0 6px 24px rgb(15 23 42 / 10%); }
      figcaption { height: 32px; font-size: 16px; font-weight: 650; }
      img { display: block; width: 100%; aspect-ratio: 16 / 9; border: 1px solid #dbe3ee; object-fit: contain; object-position: top left; background: #fff; }
    </style>
  </head>
  <body>
    <h1>网站概览：来源与本地 React 实现</h1>
    <main>
      <figure>
        <figcaption>Workbuddy 来源页（1280×720 视口捕获）</figcaption>
        <img src="../workbuddy-source/dashboard-and-prd-1280x720.jpg" alt="Workbuddy 网站概览与需求说明" />
      </figure>
      <figure>
        <figcaption>React 实现（1280×720 视口捕获）</figcaption>
        <img src="../react/overview-1280x720.jpg" alt="React 网站概览" />
      </figure>
    </main>
  </body>
</html>
