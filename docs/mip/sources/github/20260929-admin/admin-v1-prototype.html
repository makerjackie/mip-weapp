        return `<div class="detail-lines">${Object.entries(groups[name]).map(([k,v],i)=>{if(k==='当前拥有徽章'){const all=['资源链接者','活动共创官','早会发起人','机会引荐官','社群贡献者'];return `<div class="detail-line"><span class="detail-icon">${icons[i%icons.length]}</span><span class="detail-label">${k}</span><span class="detail-value">${selectedBadges.join('、')}</span><div class="badge-editor"><div class="badge-editor-title"><b>发放徽章</b><span class="small">可多选，保存后生效</span></div><div class="badge-options">${all.map(b=>`<label class="badge-option"><input type="checkbox" data-badge-choice="${b}" ${selectedBadges.includes(b)?'checked disabled':''}><span>${b}</span></label>`).join('')}</div><div class="badge-editor-actions"><button class="pbtn primary" data-save-badges="1">保存确认</button><span class="badge-save-result" data-badge-result></span></div></div></div>`}return `<div class="detail-line"><span class="detail-icon">${icons[i%icons.length]}</span><span class="detail-label">${k}</span><span class="detail-value">${value(k,v)}</span></div>`}).join('')}</div>`;

      const userDetailTabs=()=>`<div class="user-detail-tabs">${Object.keys(groups).map(g=>`<button class="user-detail-tab ${g===current?'active':''}" data-user-tab="${g}">${g}</button>`).join('')}</div>`;

    function richEditor(title){return `<section class="wide"><span class="activity-block-title">${title}</span><div class="rich-editor"><div class="editor-toolbar"><button class="editor-tool" data-cmd="bold"><b>B</b></button><button class="editor-tool" data-cmd="italic"><i>I</i></button><button class="editor-tool" data-cmd="underline"><u>U</u></button><button class="editor-tool" data-cmd="insertUnorderedList">• 列表</button><button class="editor-tool" data-cmd="justifyLeft">左对齐</button><button class="editor-tool" data-cmd="justifyCenter">居中</button><button class="editor-tool editor-upload" data-insert-image="1">＋ 插入图片</button></div><div class="editor-content" contenteditable="true" data-placeholder="请输入${title}，可添加图片并进行文字排版"></div></div></section>`}

        work.onchange=e=>{if(e.target.dataset.feeType!==undefined){const amount=work.querySelector('[data-fee-amount]'),free=e.target.value==='免费';amount.disabled=free;amount.value=free?'0':'';amount.placeholder=free?'免费活动金额固定为 0':'请输入付费金额'}};

      if(p.id==='opportunities'){
        work.innerHTML=`<div class="proto-titlebar"><div><h3>创建机会</h3><span class="small">填写机会资料，支持整段文字快速填充</span></div><button class="pbtn" data-back="1">返回</button></div><div class="proto-card"><div class="proto-form"><section class="wide"><span class="activity-block-title">粘贴整段文字填充</span><textarea data-opportunity-paste placeholder="粘贴项目名称、价值金额、主营城市、合作需求等完整内容"></textarea><div style="margin-top:8px"><button class="pbtn" data-paste-opportunity="1">识别并填充</button> <span class="small">支持粘贴完整文本后自动识别机会字段</span></div></section><label class="proto-field"><span>项目名称</span><input maxlength="20" placeholder="请输入项目名称，最多 20 个字符"></label><label class="proto-field"><span>价值金额（万元）</span><input type="number" min="0" placeholder="请输入金额，单位：万元"></label><label class="proto-field"><span>主营城市</span><input placeholder="请选择一个或多个主营城市"></label><label class="proto-field"><span>所在地区</span><input placeholder="请输入项目所在地区"></label><label class="proto-field full"><span>寻找合作方</span><textarea maxlength="300" placeholder="请输入希望寻找的合作对象，最多 300 字"></textarea></label><label class="proto-field full"><span>展开讲讲</span><textarea maxlength="300" placeholder="请输入项目背景、需求和合作说明，最多 300 字"></textarea></label><label class="proto-field"><span>可见范围</span><select><option>发布到平台</option><option>仅 MIP 内部玩家可见</option></select></label><label class="proto-field"><span>发布人</span><select><option>张凌赫</option><option>林小满</option><option>周远航</option></select></label><label class="proto-field"><span>机会状态</span><select><option>招募中</option><option>已完成</option><option>已下架</option></select></label><section class="wide"><span class="activity-block-title">项目封面</span><div class="upload-box" data-opportunity-cover-upload="1"><div><strong>＋</strong>上传项目封面<small>支持 JPG、PNG；为空时使用系统默认封面</small></div></div></section></div><div style="margin-top:14px"><button class="pbtn">预览</button> <button class="pbtn primary">保存并提交</button></div></div>`;

    drawMenu();renderTabs();render();
    document.getElementById('proto-user').onclick=()=>{document.getElementById('proto-notifications').hidden=true;document.getElementById('proto-pop').hidden=!document.getElementById('proto-pop').hidden};
    document.getElementById('proto-profile').onclick=()=>{document.getElementById('proto-pop').hidden=true;openPage('profile')};
    document.getElementById('proto-msg').onclick=()=>{document.getElementById('proto-pop').hidden=true;document.getElementById('proto-notifications').hidden=!document.getElementById('proto-notifications').hidden};
