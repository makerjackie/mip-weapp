<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>MIP · 逐页验收</title>
    <style>
      :root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --bg: #0d0f12;
  --panel: #191c21;
  --line: #343942;
  --muted: #a8aeb8;
  --text: #f4f4f5;
  --accent: #fcdf03;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
}
button,
select,
textarea {
  font: inherit;
}
button,
select {
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: inherit;
  background: #242830;
  padding: 7px 12px;
}
button {
  cursor: pointer;
}
button:hover {
  border-color: #a5abb5;
}
button:disabled {
  opacity: 0.35;
  cursor: default;
}
button:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
[hidden] {
  display: none !important;
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
.toolbar {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 66px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: #111419f5;
  backdrop-filter: blur(12px);
}
.brand {
  white-space: nowrap;
  color: var(--accent);
  font-size: 18px;
  font-weight: 800;
}
.brand span {
  margin-left: 8px;
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
}
.toolbar select {
  min-width: 0;
  max-width: 350px;
  flex: 1;
  font-size: 12px;
}
.toolbar .export {
  margin-left: auto;
  white-space: nowrap;
  font-size: 12px;
}
main {
  max-width: 1000px;
  padding: 20px 24px 245px;
  margin: auto;
}
.page-heading {
  margin-bottom: 17px;
}
.report-summary {
  margin: 0 0 14px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted);
}
.verification-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.heading-line {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
h1 {
  font-size: 19px;
  font-weight: 600;
  margin: 0;
}
.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  background: #333944;
  color: #c3cad5;
}
.badge.pass {
  background: #193827;
  color: #a2e4b8;
}
.badge.needs-fix,
.badge.failed {
  background: #442823;
  color: #ffb5a9;
}
.badge.scenario-pending {
  background: #2a251c;
  color: #edcf90;
}
.scenario-warning {
  margin: 10px 0 0;
  padding: 9px 12px;
  border-left: 3px solid #e5b95c;
  color: #edcf90;
  background: #2a251c;
  font-size: 12px;
  line-height: 1.6;
}
.ai-note {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.next-step {
  margin: 6px 0 0;
  font-size: 11px;
  line-height: 1.6;
  color: #c3cad5;
}
.comparison {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: start;
  gap: 18px;
}
.pane {
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  overflow: hidden;
}
.pane-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.pane-heading small {
  color: var(--muted);
  font-size: 10px;
}
.shot {
  width: 375px;
  max-width: 100%;
  margin: auto;
  background: #080808;
}
.shot img {
  width: 100%;
  height: auto;
  display: block;
  cursor: zoom-in;
}
.chrome-space {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 375 / 88;
  padding: 8px;
  color: #a7afbb;
  background: repeating-linear-gradient(135deg, #252a32, #252a32 7px, #21262d 7px, #21262d 14px);
  border-bottom: 1px dashed #535c6a;
  font-size: 10px;
  text-align: center;
}
.missing {
  display: grid;
  align-content: center;
  text-align: center;
  min-height: 400px;
  padding: 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}
.continuation {
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
.continuation p {
  margin: 0;
  padding: 5px 12px 12px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}
.evidence {
  margin-top: 18px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
.evidence summary {
  width: fit-content;
  cursor: pointer;
}
.evidence p {
  margin: 9px 0;
  overflow-wrap: anywhere;
  white-space: pre-line;
}
.evidence a {
  color: #e1cf78;
}
.review-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 4;
  border-top: 1px solid #4a505a;
  padding: 12px max(24px, calc((100vw - 952px) / 2)) 10px;
  background: #15191ff7;
  backdrop-filter: blur(16px);
  box-shadow: 0 -12px 35px #0004;
}
.review-topline {
  display: flex;
  align-items: center;
  gap: 12px;
}
.review-topline strong {
  font-size: 12px;
  white-space: nowrap;
}
.verdicts {
  display: flex;
  gap: 5px;
}
.verdicts button {
  min-height: 30px;
  font-size: 11px;
  padding: 5px 9px;
  white-space: nowrap;
}
.verdicts button[aria-pressed='true'] {
  color: var(--accent);
  border-color: var(--accent);
  background: #37321c;
}
.navigation {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  white-space: nowrap;
}
.navigation button {
  font-size: 12px;
}
#counter {
  color: var(--muted);
  min-width: 43px;
  text-align: center;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.previous-feedback {
  margin-top: 8px;
  color: #c8bc98;
  font-size: 11px;
  line-height: 1.5;
  max-height: 58px;
  overflow: auto;
  white-space: pre-wrap;
}
#note {
  display: block;
  width: 100%;
  min-height: 58px;
  max-height: 115px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  background: #0f1217;
  padding: 9px 11px;
  margin-top: 9px;
  font-size: 13px;
  line-height: 1.5;
}
#note::placeholder {
  color: #747e8d;
}
.review-bottomline {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin-top: 6px;
  color: #8791a0;
  font-size: 10px;
  line-height: 1.4;
}
#save-state.failed {
  color: #ffd08c;
}
dialog {
  width: min(920px, 96vw);
  max-height: 93vh;
  padding: 0 14px 14px;
  color: var(--text);
  background: #111419;
  border: 1px solid #586171;
  border-radius: 10px;
}
dialog::backdrop {
  background: #000c;
}
.zoom-toolbar {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  background: #111419;
  font-size: 12px;
}
#zoom-image {
  display: block;
  max-width: 100%;
  height: auto;
  margin: auto;
}
@media (max-width: 720px) {
  .toolbar {
    gap: 8px;
    padding: 10px 12px;
    flex-wrap: wrap;
  }
  .brand span {
    display: none;
  }
  .toolbar select {
    max-width: none;
  }
  #progress {
    display: none;
  }
  main {
    padding: 16px 10px 260px;
  }
  h1 {
    font-size: 16px;
  }
  .comparison {
    gap: 8px;
  }
  .pane-heading {
    padding: 9px 7px;
    font-size: 12px;
  }
  .pane-heading small {
    display: none;
  }
  .chrome-space {
    font-size: 8px;
    padding: 3px;
  }
  .review-panel {
    padding: 10px 12px;
  }
  .review-topline {
    flex-wrap: wrap;
    gap: 7px;
  }
  .navigation {
    width: 100%;
    justify-content: space-between;
    order: -1;
    margin: 0;
  }
  .review-bottomline span:last-child {
    display: none;
  }
}

.public-notice{font-size:13px;color:#555;line-height:1.6}.test-row{padding:12px 0;border-bottom:1px solid #ddd}.test-row p{margin:6px 0;white-space:pre-wrap}
    </style>

const feedbackLabels = { 'pass': '通过', 'needs-fix': '需调整', 'pending': '待确认' }
const storageKey = `mip-review-v2-${report.source.commit}-${report.implementation.commit}-${report.captureSet}`
let feedback = {}
let storageWarning = ''
let selected = steps.findIndex(step => step.id === location.hash.slice(1))
if (selected < 0) {
  selected = 0
}
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || '{}')
  if (!saved || typeof saved !== 'object' || Array.isArray(saved)) {
    throw new Error('Invalid feedback')
  }
  feedback = Object.fromEntries(Object.entries(saved).filter(([id, value]) => steps.some(step => step.id === id) && value && typeof value === 'object' && !Array.isArray(value)))
}
catch {
  storageWarning = '浏览器存储不可用，请在离开前导出意见。'
}

function element(tag, text, className) {
  const node = document.createElement(tag)
  if (text !== undefined) {
    node.textContent = text
  }
  if (className) {
    node.className = className
  }
  return node
}

function roleName(value) {
  return report.roleProfiles[value]?.label || value || '未登记'
}
function timestamp(value) {
  return value ? new Date(value).toLocaleString('zh-CN', { hour12: false }) : '未登记'
}

function openImage(image, label) {
  $('zoom-image').src = image.src
  $('zoom-image').alt = label
  $('zoom-label').textContent = label
  $('zoom').showModal()
}

    return box
  }
  if (chromeInset) {
    const space = element('div', '原生导航未入图 · 仅作内容对齐留白', 'chrome-space')
    space.style.aspectRatio = `375 / ${chromeInset}`
    box.append(space)
  }
  const img = element('img')
  img.src = image.src
  img.alt = label
  img.onclick = () => openImage(image, label)
  box.append(img)
  return box
}

function pane(step, side) {
  const record = step[side]
  const title = side === 'prototype' ? '原型' : '实现截图 · ' + ({devtools: '开发者工具', device: '微信真机', 'simulated-role': '模拟角色'}[step.actual.source] || '来源待确认')
  const box = element('section', undefined, 'pane')
  const heading = element('div', undefined, 'pane-heading')
  heading.append(element('strong', title), element('small', '点击查看大图'))
  box.append(heading, screenshot(record.image, `${step.id} ${title}`, side === 'actual' && record.chromeOmitted ? record.referenceChromeInsetCssPx || 88 : 0))
  for (const extra of step.additionalImages.filter(image => image.side === side || (side === 'actual' && !image.side))) {
    const continuation = element('div', undefined, 'continuation')
    continuation.append(element('p', extra.label || '下方补图（与首屏可能重叠）'), screenshot(extra.image, `${step.id} ${extra.label || '补图'}`))
    box.append(continuation)
  }
  return box
}

function updateProgress() {
  const count = Object.values(feedback).filter(value => value.status || value.note?.trim()).length
  $('progress').textContent = `已写意见 ${count} / ${steps.length}`
  $('save-state').textContent = storageWarning || '意见自动保存在当前浏览器'
  $('save-state').classList.toggle('failed', Boolean(storageWarning))
}

function saveFeedback() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(feedback))
    storageWarning = ''
  }
  catch {
    storageWarning = '意见尚未保存到浏览器。输入仍在，请先导出再离开。'
  }
  updateProgress()
}

function showVerdicts() {
  const id = steps[selected].id
  $('verdicts').replaceChildren()
  for (const [value, label] of Object.entries(feedbackLabels)) {
    const button = element('button', label)
    button.type = 'button'
    button.setAttribute('aria-pressed', String(feedback[id]?.status === value))
    button.onclick = () => {
      feedback[id] = { ...feedback[id], status: value, at: new Date().toISOString() }
      saveFeedback()
      showVerdicts()
    }
    $('verdicts').append(button)
  }
}

function showVerification(step) {
  const v = step.verification
  $('ai-state').textContent = visualLabels[v.visual.status]
  $('ai-state').className = `badge ${v.visual.status}`
  $('interaction-state').textContent = interactionLabels[v.interaction.status]
  $('interaction-state').className = `badge ${v.interaction.status}`
  $('scenario-state').textContent = v.scenario.status.startsWith('simulated') ? '场景：本地模拟' : v.scenario.status === 'matched' ? '场景：已对应' : '角色 / 数据：待补测'
  $('scenario-state').className = `badge scenario-${v.scenario.status}`
  $('device-state').textContent = v.deviceOnly ? '仅真机待测' : deviceLabels[v.device.status]
  $('device-state').className = `badge ${v.device.status}`
  $('scenario-warning').hidden = ['matched', 'simulated'].includes(v.scenario.status)
  $('scenario-warning').textContent = step.actual.roleMatches === false
    ? `目标为${roleName(step.expectedRole)}，当前截图为${roleName(step.actual.role)}。角色或数据覆盖待补，不等同于代码故障。`
    : '目标场景或数据尚未完整复现，待 AI 补测；此状态不等同于代码故障。'
  $('next-step').textContent = v.nextStep
}

function render() {
  const step = steps[selected]
  $('page-title').textContent = `${step.id} · ${step.name}`
  showVerification(step)
  $('ai-note').textContent = step.review.visualNotes || 'AI 尚未完成本页视觉核对。你可以直接留下界面意见。'
  $('comparison').replaceChildren(pane(step, 'prototype'), pane(step, 'actual'))
  $('jump').value = step.id
  $('counter').textContent = `${selected + 1} / ${steps.length}`
  $('previous').disabled = selected === 0
  $('next').disabled = selected === steps.length - 1
  $('note').value = feedback[step.id]?.note || ''
  const previous = report.previousFeedback?.feedback?.[step.id]
  $('previous-feedback').hidden = !previous
  $('previous-feedback').textContent = previous
    ? `上一轮意见（只读）：${feedbackLabels[previous.status] || '未标状态'}${previous.note ? ` · ${previous.note}` : ''}`
    : ''
  showVerdicts()
  const detail = $('evidence-content')
  detail.replaceChildren()
  detail.append(element('p', `视觉结论：${step.review.visualNotes || '待 AI 核对'}`))
  const differences = [...step.evidenceWarnings, ...(step.review.differences || [])]
  if (differences.length) {
    detail.append(element('p', differences.join('\n')))
  }
  detail.append(element('p', `原型角色：${roleName(step.expectedRole)} · 实际角色：${roleName(step.actual.role)}\n实际采集：${timestamp(step.actual.capturedAt)}\n实现版本：${report.implementation.commit}\n截图 SHA：${step.actual.image.sha256 || '无截图'}`))
  const interactionHeading = step.verification.interaction.status === 'pending' ? '交互记录（尚未据此通过）' : '交互证据'
  detail.append(element('p', `${interactionHeading}：\n${step.verification.interaction.evidence.join('\n') || '尚未记录，AI 继续补测。'}`))
  detail.append(element('p', `真机范围与记录：\n${step.verification.device.evidence.join('\n') || (step.verification.device.status === 'not-required' ? '本项未列专项真机要求。' : '尚未单列具体项目；不自动视为通过或转交人工。')}\n截图核对不替代手机号、支付、扫码等真机验证。`))
  if (/^https?:\/\//.test(step.prototype.sourceUrl || '')) {
    const link = element('a', '打开原型与标注')
    link.href = step.prototype.sourceUrl
    link.target = '_blank'
    link.rel = 'noreferrer'
    detail.append(link)
  }
  $('evidence').open = false
  updateProgress()
}

function select(index) {
  if (index < 0 || index >= steps.length) {
    return
  }
  selected = index
  history.replaceState(null, '', `#${steps[index].id}`)
  render()
  window.scrollTo({ top: 0, behavior: 'instant' })
}

function exportFeedback() {
  const body = JSON.stringify({ report: 'MIP 43-step parity', sourceCommit: report.source.commit, implementationCommit: report.implementation.commit, exportedAt: new Date().toISOString(), feedback }, null, 2)
  const url = URL.createObjectURL(new Blob([body], { type: 'application/json' }))
  const link = element('a')
  link.href = url
  link.download = `mip-43-step-feedback-${new Date().toISOString().slice(0, 10)}.json`
  document.body.append(link)
  link.click()
  link.remove()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
}

for (const step of steps) {
  const option = element('option', `${step.id} · ${step.name}`)
  option.value = step.id
  $('jump').append(option)
}
$('report-summary').textContent = `模拟画面已核对 43 页 · 已知问题 ${report.summary.knownIssues} 项 · 角色 / 数据待补 ${report.summary.scenarioPending} 项 · AI 继续补测 ${report.summary.aiPending} 项 · 仅真机待测 ${report.summary.deviceOnly} 项（分类可重叠）`
$('jump').onchange = () => select(steps.findIndex(step => step.id === $('jump').value))
$('previous').onclick = () => select(selected - 1)
$('next').onclick = () => select(selected + 1)
$('note').oninput = () => {
  const id = steps[selected].id
  feedback[id] = { ...feedback[id], note: $('note').value, at: new Date().toISOString() }
  saveFeedback()
}
$('export').onclick = exportFeedback
$('close-zoom').onclick = () => $('zoom').close()
$('zoom').onclick = (event) => {
  if (event.target === $('zoom')) {
    $('zoom').close()
  }
}
window.addEventListener('hashchange', () => {
  const index = steps.findIndex(step => step.id === location.hash.slice(1))
  if (index >= 0) {
    select(index)
  }
})
document.addEventListener('keydown', (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey || ['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName) || event.target.isContentEditable || $('zoom').open) {
    return
  }
  if (['ArrowRight', 'ArrowDown'].includes(event.key)) {
    event.preventDefault()
    select(selected + 1)
  }
  if (['ArrowLeft', 'ArrowUp'].includes(event.key)) {
    event.preventDefault()
    select(selected - 1)
  }
})
render()

/* global report, element */
const testModeLabels = { 'test-account-service': '测试账号 · 服务端', 'simulated-role': '模拟角色 · 页面', 'devtools': '开发者工具 · 真实会话', 'device': '微信真机', 'automated-contract': '自动化合同测试' }
const testStatusLabels = { pass: '已通过', fail: '未通过', pending: '待测' }
const testRoot = document.getElementById('public-test-results')
const testCases = report.testResults.cases
const passedCases = testCases.filter(item => item.status === 'pass').length
testRoot.append(element('p', `本轮 ${testCases.length} 项记录，${passedCases} 项通过。服务端与模拟角色测试不替代真实微信登录、手机号、支付和扫码验收。`))
for (const item of testCases) {
  const row = element('div', undefined, 'test-row')
  row.append(element('strong', `${testStatusLabels[item.status]} · ${testModeLabels[item.mode]} · ${item.summary}`))
  if (item.stepIds.length) {
    const links = element('p', '关联页面：')
    for (const id of item.stepIds) {
      const link = element('a', `${id} `)
      link.href = `#${id}`
      links.append(link)
    }
    row.append(links)
  }
  if (item.evidence) {
    row.append(element('p', `证据：${item.evidence}`))
  }
  if (item.limitations?.length) {
    row.append(element('p', `范围：${item.limitations.join('；')}`))
  }
  testRoot.append(row)
}

    </script>
  </body>
